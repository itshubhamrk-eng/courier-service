# Builds this app's image and publishes it to GitHub Container Registry for hosting beside the OCCPL platform
# (see the OCCPL repo's infra/vps/RUNBOOK.md). Tags: the commit SHA and "dev". Does not deploy anything.
name: Image

on:
  push:
    branches: [main, claude/occpl-platform-sso]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/courier-service:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/courier-service:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
